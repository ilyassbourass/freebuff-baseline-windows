<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="freebuffBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0d14" />
      <stop offset="50%" stop-color="#181324" />
      <stop offset="100%" stop-color="#0a0810" />
    </linearGradient>

    <!-- Amber Glow -->
    <radialGradient id="amberGlow" cx="20%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0f0d14" stop-opacity="0" />
    </radialGradient>

    <!-- Crimson Glow -->
    <radialGradient id="crimsonGlow" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#b91c1c" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0f0d14" stop-opacity="0" />
    </radialGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241b35" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#140f20" stop-opacity="0.7" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.5" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="0" stdDeviation="30" flood-color="#f59e0b" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#freebuffBg)" />
  <rect width="1200" height="420" fill="url(#amberGlow)" />
  <rect width="1200" height="420" fill="url(#crimsonGlow)" />

  <!-- Grid -->
  <g opacity="0.06" stroke="#fbbf24" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="420" />
    <line x1="240" y1="0" x2="240" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="560" y1="0" x2="560" y2="420" />
    <line x1="720" y1="0" x2="720" y2="420" />
    <line x1="880" y1="0" x2="880" y2="420" />
    <line x1="1040" y1="0" x2="1040" y2="420" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Top Pill -->
  <g transform="translate(60, 48)">
    <rect width="250" height="28" rx="14" fill="#f59e0b" fill-opacity="0.15" stroke="#fbbf24" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#fbbf24" />
    <text x="28" y="19" class="mono" font-size="11" font-weight="600" fill="#fde68a" letter-spacing="0.5">CPU COMPATIBILITY WORKAROUND</text>

    <!-- Target Badge -->
    <rect x="260" y="0" width="135" height="28" rx="14" fill="#ef4444" fill-opacity="0.15" stroke="#f87171" stroke-width="1" />
    <circle cx="274" cy="14" r="4" fill="#f87171" />
    <text x="285" y="19" class="mono" font-size="11" font-weight="600" fill="#fca5a5">AVX2 Fix • x64</text>
  </g>

  <!-- Main Title Area -->
  <g transform="translate(60, 130)">
    <text class="sans" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Freebuff Baseline <tspan fill="#f59e0b">⚡💻</tspan>
    </text>
    <text y="42" class="sans" font-size="20" font-weight="500" fill="#94a3b8">
      Run Freebuff on Older Windows CPUs Without AVX2
    </text>
    <text y="74" class="sans" font-size="14.5" font-weight="400" fill="#64748b">
      Fixes crash 0xC000001D / exit code 3221225501 on Intel Core i3/i5/i7 &amp; Xeon legacy chips.
    </text>
    <text y="96" class="sans" font-size="14.5" font-weight="500" fill="#fbbf24">
      Automated PowerShell 1-liner compiles from official Codebuff source using Bun baseline runtime.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 140)">
      <g>
        <rect width="136" height="34" rx="8" fill="#201830" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4" />
        <text x="14" y="22" class="sans" font-size="12" font-weight="600" fill="#fde68a">🥟 Bun Baseline</text>
      </g>
      <g transform="translate(146, 0)">
        <rect width="150" height="34" rx="8" fill="#201830" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4" />
        <text x="14" y="22" class="sans" font-size="12" font-weight="600" fill="#fde68a">⚡ 1-Line PS Install</text>
      </g>
      <g transform="translate(306, 0)">
        <rect width="144" height="34" rx="8" fill="#201830" stroke="#ef4444" stroke-width="1" stroke-opacity="0.4" />
        <text x="14" y="22" class="sans" font-size="12" font-weight="600" fill="#fca5a5">🚫 Zero AVX2 Req</text>
      </g>
      <g transform="translate(460, 0)">
        <rect width="138" height="34" rx="8" fill="#201830" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
        <text x="14" y="22" class="sans" font-size="12" font-weight="600" fill="#a7f3d0">🛡️ MIT Licensed</text>
      </g>
    </g>
  </g>

  <!-- Right Graphic: Terminal Card -->
  <g transform="translate(680, 50)" filter="url(#shadow)">
    <rect width="460" height="315" rx="18" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

    <!-- Terminal Bar -->
    <rect width="460" height="42" rx="18" fill="#140f20" fill-opacity="0.8" />
    <circle cx="24" cy="21" r="5" fill="#ef4444" />
    <circle cx="40" cy="21" r="5" fill="#f59e0b" />
    <circle cx="56" cy="21" r="5" fill="#10b981" />
    <text x="76" y="26" class="mono" font-size="12" font-weight="600" fill="#e2e8f0">POWERSHELL • x64 BASELINE</text>
    <text x="365" y="26" class="mono" font-size="11" font-weight="600" fill="#10b981">PATCHED</text>

    <!-- Terminal Code / Output -->
    <g transform="translate(24, 60)">
      <!-- Error Box (Before) -->
      <rect width="412" height="70" rx="8" fill="#1c1117" stroke="#ef4444" stroke-opacity="0.6" stroke-width="1" />
      <text x="16" y="26" class="mono" font-size="11.5" font-weight="700" fill="#f87171">❌ Official Freebuff Binary Crash:</text>
      <text x="16" y="46" class="mono" font-size="11" fill="#fca5a5">Process exited with code 3221225501 (0xC000001D)</text>
      <text x="16" y="62" class="mono" font-size="10.5" fill="#fda4af">Illegal instruction: Your CPU may not support AVX2</text>

      <!-- Arrow -->
      <text x="200" y="96" class="sans" font-size="18" fill="#f59e0b">⬇️</text>

      <!-- Patched Box (After) -->
      <g transform="translate(0, 110)">
        <rect width="412" height="115" rx="8" fill="#0d1b15" stroke="#10b981" stroke-opacity="0.6" stroke-width="1" />
        <text x="16" y="26" class="mono" font-size="11.5" font-weight="700" fill="#34d399">✅ Freebuff Baseline Installer Result:</text>
        <text x="16" y="50" class="mono" font-size="11" fill="#cbd5e1">PS &gt; freebuff --version</text>
        <text x="16" y="70" class="mono" font-size="11" font-weight="700" fill="#a7f3d0">freebuff v0.1.x (bun-windows-x64-baseline)</text>
        <text x="16" y="94" class="mono" font-size="10.5" fill="#38bdf8">✓ Tested on Intel Core i5 650 &amp; Legacy x64 chips</text>
      </g>
    </g>
  </g>
</svg>
