name: Install bug
description: Report a Freebuff baseline installer problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the exact error text.
    validations:
      required: true
  - type: input
    id: cpu
    attributes:
      label: CPU model
      placeholder: Intel Core i5 650
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 10 22H2
  - type: textarea
    id: output
    attributes:
      label: Command output
      render: text
  - type: checkboxes
    id: terms
    attributes:
      label: Scope check
      options:
        - label: This is about local install/build compatibility, not bypassing Freebuff server restrictions.
          required: true
